[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/capture",
    "crates/encode",
    "crates/audio",
    "crates/platform",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/screenrecorder"
rust-version = "1.80"

# Perfil de release orientado a tamaño y consumo de recursos (objetivo: binario < 15 MB).
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
