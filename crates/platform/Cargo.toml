[package]
name = "sr-platform"
description = "Hotkeys globales, bandeja, permisos, rutas y notificaciones por plataforma"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
global-hotkey = "0.9"
tray-icon = "0.24"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSColor", "NSView", "NSWindow"] }
